<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Von Zeus Gallego — CV</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon.png" />
    <link rel="shortcut icon" href="assets/img/icon.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Google Sans Code", "ui-sans-serif", "system-ui"],
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="antialiased text-gray-800 bg-white font-sans scroll-smooth">
    <div id="loadingScreen" class="fixed inset-0 z-50 flex items-center justify-center
         bg-gray-900
         transition-opacity duration-500 ease-out">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-gray-600 border-t-white rounded-full animate-spin"></div>
            <p class="text-sm text-gray-300 tracking-wide"> Loading my portfolio...</p>
        </div>
    </div>
    <!-- Banner -->
    <section id="banner" class="relative bg-cover bg-center" style="background-image: url(&quot;assets/img/banner_bg.jpg&quot;)">
        <!-- overlay: darken + blur -->
        <div class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm -webkit-backdrop-blur-sm"></div>

        <div class="relative max-w-7xl mx-auto px-4 py-4 md:py-4">
            <!-- Top nav: name left, menu right -->
            <div class="flex items-center justify-between">
                <div id="bannerLogo" class="flex items-center">
                    <img src="assets/img/icon.png" alt="VZG Logo" class="w-6 h-6 md:w-12 md:h-12 object-contain" />
                </div>
                <nav class="space-x-1 md:space-x-6 text-xs md:text-base">
                    <a href="#about" class="text-white hover:underline">About</a>
                    <a href="#experience" class="text-white hover:underline">Experience</a>
                    <a href="#skills" class="text-white hover:underline">Skills</a>
                    <a href="#contact" class="text-white hover:underline">Contact me</a>
                </nav>
            </div>

            <!-- Main banner content -->
            <div class="max-w-6xl mt-6 md:mt-16 mx-auto flex flex-row items-center gap-4 md:gap-12 md:mb-16">
                <!-- Left: circled image -->
                <div class="flex-shrink-0">
                    <img id="bannerImage" src="assets/img/myPic.png" alt="Profile" class="w-24 h-24 md:w-48 md:h-48 rounded-full object-cover ring-4 ring-white shadow-xl" />
                </div>

                <!-- Right: text -->
                <div class="text-white">
                    <div class="div-one flex flex-col gap-1 md:gap-4">
                        <h1 id="bannerGreeting" class="text-sm md:text-base md:font-extrabold">
                            Hi, I am Von Zeus Gallego
                        </h1>
                        <h2 id="bannerTitle" class="text-xl md:text-2xl font-semibold">
                            Front End Developer
                        </h2>
                        <p id="bannerDescription" class="max-w-2xl text-xs md:text-sm md:text-base text-white/90 font-semibold">
                            Focused on enterprise web and mobile applications
                        </p>
                    </div>
                    <div class="div-two hidden md:block mt-4">
                        <div id="bannerSkillsDesktop" class="flex flex-wrap gap-2 mt-4">
                            <!-- JS will populate pills here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mobile-only info (below image + name/title) -->
            <div class="block mt-4 md:hidden text-white">
                <div id="bannerSkillsMobile" class="flex flex-wrap justify-center gap-x-2 mt-4 text-[8px] text-white/90 text-center">
                    <!-- JS will populate skills here -->
                </div>
            </div>
        </div>
    </section>

    <!-- About section -->
    <section id="about" class="bg-white">
        <div class="max-w-6xl mx-auto p-6">
            <h2 id="aboutTitle" class="text-3xl font-bold">About Me</h2>
        </div>
        <div class="bg-gray-100/50 p-6">
            <div id="aboutContent" class="max-w-6xl mx-auto md:px-4">
                <!-- Content will be rendered here -->
            </div>
        </div>
    </section>

    <!-- Experience section -->
    <section id="experience" class="bg-white pt-8">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="text-3xl font-bold mb-8">Experience</h2>
        </div>
        <!-- Experience Cards Grid -->
        <div class="bg-gray-100/50 p-6">
            <div id="experienceCards" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cards will be rendered here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Skills section -->
    <section id="skills" class="bg-white pt-8">
        <div class="max-w-6xl mx-auto px-6">
            <h2 id="skillsTitle" class="text-3xl font-bold mb-8">Skills</h2>
        </div>
        <div class="bg-gray-100/50 p-6">
            <div id="skillsContainer" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <!-- Skills will be rendered here -->
            </div>
        </div>
    </section>

    <!-- Contact/Footer section -->
    <section id="contact" class="bg-gray-900 text-white py-12">
        <div class="max-w-6xl mx-auto px-6">
            <h2 id="contactTitle" class="text-3xl font-bold mb-4 text-center">
                Get In Touch
            </h2>
            <p id="contactMessage" class="text-center text-gray-300 mb-8 max-w-2xl mx-auto"></p>
            <div id="contactContent" class="flex flex-col items-center gap-8">
                <!-- Contact info will be rendered here -->
            </div>
        </div>
    </section>

    <script>
        // Fetch all data from portfolio.json and populate the page
        fetch("assets/data/portfolio.json")
            .then((response) => response.json())
            .then((data) => {
                    console.log("Loaded portfolio data:", data); // Debug log
                    //   hide loading screen after data is loaded
                    const loader = document.getElementById("loadingScreen");
                    setTimeout(() => {
                        loader.classList.add("opacity-0");
                        setTimeout(() => loader.classList.add("hidden"), 300);
                    }, 2000);

                    const banner = data.banner;
                    document.getElementById("banner").style.backgroundImage =
                        `url("${banner.backgroundImage}")`;
                    document.getElementById("bannerGreeting").textContent =
                        `Hi, I am ${banner.name}`;
                    document.getElementById("bannerTitle").textContent = banner.title;
                    document.getElementById("bannerDescription").textContent =
                        banner.description;
                    document.getElementById("bannerImage").src = banner.profileImage;
                    document.getElementById("bannerImage").alt = banner.name;
                    const skillsContainerMobile = document.getElementById("bannerSkillsMobile");
                    skillsContainerMobile.innerHTML = data.skills
                        .map(
                            (skill, index) => `
                          <span class="flex items-center gap-1">
                            <i class="${skill.icon}"></i>
                            <span>${skill.name}</span>
                          </span>
                        `
                        )
                        .join("");
                    const skillContainer = document.getElementById("bannerSkillsDesktop");
                    skillContainer.innerHTML = data.skills
                        .map(
                            (skill) => `
                      <div
                          class="flex items-center gap-1 px-3 py-1
                              bg-white/10 border border-white/20
                              rounded-full text-[8px] text-white uppercase
                              backdrop-blur-sm"
                      >
                          <i class="${skill.icon} text-[8px]"></i>
                          <span class="text-xs">${skill.name}</span>
                      </div>
                      `,
                        )
                        .join("");
                    // Populate About
                    const about = data.about;
                    document.getElementById("aboutTitle").textContent = about.title;
                    const aboutHTML = about.paragraphs
                        .map(
                            (paragraph, index) =>
                            `<p class="text-gray-700 leading-relaxed${index > 0 ? " mt-2" : ""}">${paragraph}</p>`,
                        )
                        .join("");
                    document.getElementById("aboutContent").innerHTML = aboutHTML;

                    // Populate Skills
                    if (data.skills) {
                        const skillsContainer = document.getElementById("skillsContainer");
                        skillsContainer.innerHTML = "";
                        data.skills.forEach((skill) => {
                            const skillCard = document.createElement("div");
                            skillCard.className =
                                "flex flex-col items-center justify-center p-6 bg-white rounded-lg border border-gray-200 hover:shadow-md transition-shadow";
                            skillCard.innerHTML = `
                <i class="${skill.icon} text-4xl ${skill.color} mb-3"></i>
                <p class="text-sm font-semibold text-gray-900 text-center">${skill.name}</p>
              `;
                            skillsContainer.appendChild(skillCard);
                        });
                    }

                    // Populate Experience
                    const experienceContainer =
                        document.getElementById("experienceCards");
                    experienceContainer.innerHTML = "";
                    data.experiences.forEach((experience) => {
                                const card = document.createElement("div");
                                card.className =
                                    "bg-white border border-gray-200 rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow";

                                const achievementsList = experience.achievements
                                    .map((achievement) => `<li>• ${achievement}</li>`)
                                    .join("");

                                const technologiesHTML =
                                    experience.technologies && experience.technologies.length > 0 ?
                                    `<div class="mt-4 flex gap-3 flex-wrap">${experience.technologies
                    .map((techName) => {
                      const skill = data.skills.find(
                        (s) => s.name === techName,
                      );
                      return skill
                        ? `<i class="${skill.icon} text-xl text-gray-700" title="${techName}"></i>`
                        : "";
                    })
                    .join("")}</div>`
                : "";

            card.innerHTML = `
              <h3 class="text-xl font-bold text-gray-900">${experience.title}</h3>
              <p class="text-sm text-gray-500 mt-1">${experience.company} • ${experience.startDate} - ${experience.endDate}</p>
              <ul class="mt-4 text-gray-700 space-y-2 text-sm">
                ${achievementsList}
              </ul>
              ${technologiesHTML}
            `;

            experienceContainer.appendChild(card);
          });

          // Populate Contact
          if (data.contact) {
            const contactContent = document.getElementById("contactContent");
            const contact = data.contact;

            // Set title and message
            document.getElementById("contactTitle").textContent = contact.title;
            document.getElementById("contactMessage").textContent =
              contact.message;

            // Phone and Email section
            const contactInfo = document.createElement("div");
            contactInfo.className =
              "flex flex-col md:flex-row gap-8 items-center justify-center";
            contactInfo.innerHTML = `
              <a href="tel:${contact.phone.replace(/\s/g, "")}" class="flex items-center gap-3 hover:text-blue-400 transition">
                <i class="fas fa-phone text-2xl"></i>
                <span class="text-lg">${contact.phone}</span>
              </a>
              <a href="mailto:${contact.email}" class="flex items-center gap-3 hover:text-blue-400 transition">
                <i class="fas fa-envelope text-2xl"></i>
                <span class="text-lg">${contact.email}</span>
              </a>
            `;
            contactContent.appendChild(contactInfo);

            // Social links section
            const socialDiv = document.createElement("div");
            socialDiv.className = "flex gap-6 justify-center";
            contact.social.forEach((social) => {
              const link = document.createElement("a");
              link.href = social.url;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.className = "text-3xl hover:text-blue-400 transition";
              link.title = social.name;
              link.innerHTML = `<i class="${social.icon}"></i>`;
              socialDiv.appendChild(link);
            });
            contactContent.appendChild(socialDiv);
          }
        })
        .catch((error) =>
          console.error("Error loading portfolio data:", error),
        );

        document.addEventListener("DOMContentLoaded", () => {
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        const aboutSection = document.getElementById("about");

        if (!scrollTopBtn || !aboutSection) return;

        window.addEventListener("scroll", () => {
          const aboutTop = aboutSection.offsetTop;
          const scrollPosition = window.scrollY + 120;

              if (scrollPosition >= aboutTop) {
                scrollTopBtn.classList.remove("opacity-0", "pointer-events-none");
                scrollTopBtn.classList.add("opacity-100");
              } else {
                scrollTopBtn.classList.add("opacity-0", "pointer-events-none");
                scrollTopBtn.classList.remove("opacity-100");
              }
            });
        });
    </script>
    <a href="#banner" id="scrollTopBtn" class="fixed bottom-6 right-6 z-50
          flex items-center justify-center
          w-12 h-12 rounded-full
          bg-blue-800/20
          text-white
          shadow-lg
          opacity-0 pointer-events-none
          transition-all duration-300">
        <i class="fas fa-chevron-up text-lg"></i>
    </a>
</body>

</html>
